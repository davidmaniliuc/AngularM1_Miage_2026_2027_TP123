<section class="card">
  <div class="body">
    <h1>Créer un compte</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Nom<input formControlName="name" autocomplete="name" /></label>
      <label>Email<input type="email" formControlName="email" autocomplete="email" /></label>
      <label>Mot de passe<input type="password" formControlName="password" autocomplete="new-password" /></label>
      <button type="submit">Créer mon compte</button>
    </form>
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <p class="alt">Déjà inscrit ? <a routerLink="/login">Se connecter</a></p>
  </div>
</section>
