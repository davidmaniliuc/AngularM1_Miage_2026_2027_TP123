<section class="card">
  <div class="body">
    <h1>Mon profil</h1>
    @if (auth.currentUser(); as user) {
      <dl class="identity">
        <dt>Nom</dt><dd>{{ user.name }}</dd>
        <dt>Email</dt><dd>{{ user.email }}</dd>
        <dt>Membre depuis</dt><dd class="mono">{{ user.createdAt | date: 'd MMM y' }}</dd>
      </dl>
      <form [formGroup]="form" (ngSubmit)="save()">
        <label>Nouveau nom<input formControlName="name" autocomplete="name" /></label>
        <div class="submit-row">
          <button type="submit" [disabled]="saving() || form.invalid">
            {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
          </button>
          @if (saved()) {
            <span class="saved-msg" role="status"><mat-icon>check</mat-icon>Nom enregistré</span>
          }
        </div>
      </form>
      @if (error()) {
        <p class="error" role="alert"><mat-icon class="icon-fill">error</mat-icon><span>{{ error() }}</span></p>
      }
    }
  </div>
</section>
