<section class="card">
  <div class="body">
    <h1>Connexion</h1>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Email<input type="email" formControlName="email" autocomplete="email" /></label>
      <label>Mot de passe<input type="password" formControlName="password" autocomplete="current-password" /></label>
      <button type="submit">Se connecter</button>
    </form>
    @if (error()) {
      <p class="error" role="alert"><mat-icon class="icon-fill">error</mat-icon><span>{{ error() }}</span></p>
    }
    <p class="alt">Pas encore de compte ? <a routerLink="/register">Créer un compte</a></p>
  </div>
</section>
