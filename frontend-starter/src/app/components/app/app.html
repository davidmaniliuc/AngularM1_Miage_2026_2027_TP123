<header class="topbar">
  <a class="logo" routerLink="/games" aria-label="Guitar Practice Cloud, accueil">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6.5l3.6 6h-7.2z" stroke="#3eb489"/><rect x="5.2" y="13.2" width="6.6" height="6.6" rx="0.6" stroke="#e27bb4"/><circle cx="24.5" cy="16.5" r="3.5" stroke="#e0463f"/><path d="M12.7 22.2l6.6 6.6m0-6.6l-6.6 6.6" stroke="#4a7bd6"/></svg></span>
    <span class="brand">Guitar Practice Cloud</span>
  </a>

  <nav aria-label="Navigation principale">
    @if (currentUser(); as user) {
      <a routerLink="/games" routerLinkActive="active" ariaCurrentWhenActive="page">Jeux</a>
      <a routerLink="/tracks" routerLinkActive="active" ariaCurrentWhenActive="page">Musique</a>
      <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">Profil</a>
      <span class="user">
        <span class="name">{{ user.name }}</span>
        <span class="avatar" aria-hidden="true">{{ user.name.charAt(0).toUpperCase() }}</span>
      </span>
      <button mat-button type="button" data-testid="logout" (click)="logout()">
        <mat-icon>logout</mat-icon><span class="logout-label">Déconnexion</span>
      </button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Connexion</a>
      <a routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page">Inscription</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
