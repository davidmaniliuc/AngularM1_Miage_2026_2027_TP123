<aside class="spine">
  <a class="logo" routerLink="/games" aria-label="Guitar Practice Cloud, accueil">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.6l4.6 8h-9.2z" class="ps-triangle"/><circle cx="24" cy="8" r="4.2" class="ps-circle"/><path d="M4.4 20.4l7.2 7.2m0-7.2l-7.2 7.2" class="ps-cross"/><rect x="20.2" y="20.2" width="7.6" height="7.6" rx="0.8" class="ps-square"/></svg></span>
    <span class="brand">Guitar Practice Cloud</span>
  </a>

  <nav aria-label="Navigation principale">
    @if (currentUser(); as user) {
      <!-- Chaque section garde le symbole de manette qui la représente. -->
      <a routerLink="/games" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg class="sym" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5l9 9m0-9l-9 9" class="ps-cross"/></svg>Jeux
      </a>
      <a routerLink="/tracks" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg class="sym" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4.8" class="ps-circle"/></svg>Musique
      </a>
      <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">
        <svg class="sym" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3l5.2 9H2.8z" class="ps-triangle"/></svg>Profil
      </a>

      <div class="foot">
        <span class="strip" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="user">
          <span class="avatar" aria-hidden="true">{{ user.name.charAt(0).toUpperCase() }}</span>
          <span class="name">{{ user.name }}</span>
        </span>
        <button mat-button type="button" class="logout" data-testid="logout" (click)="logout()">
          <mat-icon>logout</mat-icon><span class="logout-label">Déconnexion</span>
        </button>
      </div>
    } @else {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Connexion</a>
      <a routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page">Inscription</a>
      <div class="foot">
        <span class="strip" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </div>
    }
  </nav>
</aside>

<main [class.with-player]="playback.currentTrack()">
  <router-outlet />
</main>

<!-- Le lecteur reste en bas de l'écran d'une section à l'autre. -->
@if (currentUser() && playback.currentTrack(); as current) {
  <app-audio-player [track]="current" [src]="playback.audioUrl()" [blob]="playback.audioBlob()"
                    (playingChange)="playback.playing.set($event)" (audioError)="playback.reportDecodeError()" />
}
