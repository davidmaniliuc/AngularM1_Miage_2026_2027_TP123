<header class="topbar">
  <a class="logo" routerLink="/games" aria-label="PS1 Library, accueil">
    <span class="mark" aria-hidden="true"><mat-icon class="icon-fill">sports_esports</mat-icon></span>
    <span class="brand">PS1 Library</span>
  </a>

  <nav aria-label="Navigation principale">
    @if (currentUser(); as user) {
      <a routerLink="/games" routerLinkActive="active" ariaCurrentWhenActive="page">Mes jeux</a>
      <a routerLink="/tracks" routerLinkActive="active" ariaCurrentWhenActive="page">Musique</a>
      <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">Profil</a>
      <span class="user">
        <span class="name">{{ user.name }}</span>
        <span class="avatar" aria-hidden="true">{{ user.name.charAt(0).toUpperCase() }}</span>
      </span>
      <button mat-button type="button" data-testid="logout" (click)="logout()">
        <mat-icon>logout</mat-icon><span class="logout-label">Déconnexion</span>
      </button>
    } @else {
      <a routerLink="/login" routerLinkActive="active" ariaCurrentWhenActive="page">Connexion</a>
      <a routerLink="/register" routerLinkActive="active" ariaCurrentWhenActive="page">Inscription</a>
    }
    <button mat-icon-button type="button" class="theme-toggle" data-testid="theme-toggle" (click)="theme.toggle()"
            [attr.aria-label]="theme.theme() === 'dark' ? 'Passer au thème clair' : 'Passer au thème sombre'">
      <mat-icon>{{ theme.theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </nav>
</header>

<main>
  <router-outlet />
</main>
